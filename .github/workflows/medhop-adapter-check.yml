name: MedHop adapter (offline smoke tests)
on:
  push:
    paths:
      - 'mhrag_v13_modular_starter/benchmarks/medhop/**'
      - '.github/workflows/medhop-adapter-check.yml'
  pull_request:
    paths:
      - 'mhrag_v13_modular_starter/benchmarks/medhop/**'
      - '.github/workflows/medhop-adapter-check.yml'
  workflow_dispatch:
jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests (no data download and no GPU)
        run: python -m unittest discover -s mhrag_v13_modular_starter/benchmarks/medhop/tests -v
